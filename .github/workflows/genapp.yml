name: build_apk

# action事件触发
on:
    workflow_dispatch:
    push:
        # push tag时触发
        tags:
            - v*

# 可以有多个jobs
jobs:
    build_apk:
        # 运行环境 ubuntu-latest window-latest mac-latest
        runs-on: ubuntu-latest

        # 每个jobs中可以有多个steps
        steps:
            - name: 拉取代码
              uses: actions/checkout@v3

            - name: 构建Java环境
              uses: actions/setup-java@v3
              with:
                  distribution: "zulu"
                  java-version: "17"
                  token: ${{secrets.GIT_TOKEN}}

            - name: 检查缓存
              uses: actions/cache@v4
              id: cache-flutter
              with:
                  path: /root/flutter-sdk # Flutter SDK 的路径
                  key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}

            - name: 安装Flutter
              if: steps.cache-flutter.outputs.cache-hit != 'true'
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: 3.41.5
                  channel: stable
#            - name: Gradle download
#              use: gradle/gradle-build-action@v2

            - name: 下载项目依赖
              run: flutter pub get

#            - name: Build with Gradle
#              run: |
#                cd android
#                ./gradlew build
#                cd ..

            - name: Prepare Android signing files
              run: |
                echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.jks
                echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
                echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
                echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
                echo "storeFile=keystore.jks" >> android/key.properties   # 相对 android/ 目录
              working-directory: .   # 或你的项目根

#            - name: 修改错误kotlin
#              run: sed -i '13s/^.*$/jvmTarget = '\''1.8'\''/' "${PUB_CACHE}/hosted/pub.flutter-io.cn/shared_preferences_android-2.4.7/android/build.gradle"

            - name: flutter build apk --release
              # 对应 android/app/build.gradle signingConfigs中的配置项
              run: flutter build apk --release --split-per-abi
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD}}

            - name: 发布apk
              uses: ncipollo/release-action@v1.5.0
              with:
                  artifacts: "build/app/outputs/apk/release/*.apk"
                  token: ${{ secrets.RELEASE_TOKEN }}
